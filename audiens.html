<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klaim SIM JP SMART SIM - IJFF Odaiba 2026</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#13233a;--mute:#5b6b7d;--line:#d3dce4;--acc:#0b7a83;--acc-ink:#fff;--warn:#9a4a00;--warn-bg:#fff2e0;--err:#b3261e;--ok-bg:#e3f4f2}
@media(prefers-color-scheme:dark){:root{--bg:#0e1722;--card:#16222f;--ink:#e8eef4;--mute:#9bacbd;--line:#2c3b4c;--acc:#45bcc4;--acc-ink:#06202a;--warn:#ffb866;--warn-bg:#33240f;--err:#ff8a80;--ok-bg:#12302f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:480px;margin:0 auto}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:18px;background:var(--ok-bg);border-left:4px solid var(--acc)}
.banner.paid{background:var(--warn-bg);border-color:var(--warn)}
.banner strong{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;margin:14px 0 4px}
label:first-child{margin-top:0}
input[type=text],input[type=tel],select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[readonly]{opacity:.85;font-weight:700;letter-spacing:.06em}
.hint{font-size:.86rem;color:var(--mute);margin:4px 0 0}
.hint.bad{color:var(--err)}
.hint.good{color:var(--acc)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}
.check input{margin-top:5px;width:18px;height:18px;flex:none}
button{width:100%;margin-top:18px;padding:13px;font:inherit;font-weight:700;color:var(--acc-ink);background:var(--acc);border:0;border-radius:10px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);margin:12px 0 0;font-weight:600}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.ticket{background:var(--card);border:2px dashed var(--acc);border-radius:16px;padding:24px 20px;text-align:center}
.ticket .id{font-size:2.1rem;font-weight:800;letter-spacing:.14em;margin:6px 0}
.ticket ul{text-align:left;margin:14px 0 0;padding-left:20px}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.ticket{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
<link rel="icon" href="https://marketingexata.github.io/afiliatorjp/logojps.png">
<style id="jpl-css">
.brand-logo{height:40px;width:auto;max-width:132px;object-fit:contain;flex:none;border-radius:10px}
.login-logo{display:block;height:54px;max-width:200px;object-fit:contain;margin:0 auto 14px}
.top-logo{height:34px;width:auto;max-width:96px;object-fit:contain;background:#fff;padding:3px 6px;border-radius:10px;flex:none}
@media(min-width:900px){.top-logo{display:none}}
:root{--jpl2:#ff9f1c}
.jpl{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(26,16,51,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s}
.jpl.on{opacity:1;visibility:visible}
.jpl-box{width:min(290px,100%);background:var(--card,#fff);color:var(--ink,#24112f);border-radius:26px;padding:28px 22px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.38)}
.jpl-ring{position:relative;width:136px;height:136px;margin:0 auto 16px}
.jpl-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.jpl-ring .tr{fill:none;stroke:var(--line,#f3d6e5);stroke-width:9}
.jpl-ring .pg{fill:none;stroke:url(#jplg);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset .25s ease}
.jpl-spin{position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc,#f0156e);border-right-color:var(--jpl2,#ff9f1c);opacity:.6;animation:jpls 1.1s linear infinite}
.jpl-logo{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;object-fit:contain}
.jpl-pct{font-size:2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.jpl-lb{font-weight:700;margin-top:4px}
.jpl-sub{font-size:.84rem;color:var(--mute,#7b6687);min-height:1.3em;margin-top:2px}
@keyframes jpls{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.jpl-spin{animation:none;opacity:0}.jpl,.jpl-ring .pg{transition:none}}
</style>
<script>
var JP_LOGO='https://marketingexata.github.io/afiliatorjp/logojps.png',JP_LOGO_ALT='http://marketingexata.github.io/afiliatorjp/logojps.png';
function jpLogoErr(i){if(!i.dataset.f){i.dataset.f='1';i.src=JP_LOGO_ALT;}else{i.style.visibility='hidden';}}
var JPL=(function(){
  var C=326.73,tasks=[],el=null,pgEl,pctEl,lbEl,subEl,tick=null,showT=null,shownAt=0,hideT=null;
  var SUB={up:'Mengunggah data',wait:'Memproses di server',dl:'Mengunduh hasil'};
  function isOn(){return !!el&&el.classList.contains('on');}
  function build(){
    if(el)return;
    el=document.createElement('div');el.className='jpl';el.setAttribute('role','status');el.setAttribute('aria-live','polite');
    el.innerHTML='<div class="jpl-box"><div class="jpl-ring"><i class="jpl-spin"></i>'+
      '<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="jplg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc,#f0156e)"/><stop offset="1" style="stop-color:var(--jpl2,#ff9f1c)"/></linearGradient></defs>'+
      '<circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52"/></svg>'+
      '<img class="jpl-logo" alt="" src="'+JP_LOGO+'" onerror="jpLogoErr(this)"></div>'+
      '<div class="jpl-pct">0%</div><div class="jpl-lb">Memuat</div><div class="jpl-sub"></div></div>';
    document.body.appendChild(el);
    pgEl=el.querySelector('.pg');pctEl=el.querySelector('.jpl-pct');lbEl=el.querySelector('.jpl-lb');subEl=el.querySelector('.jpl-sub');
  }
  function paint(){
    if(!isOn())return;
    var sum=0;tasks.forEach(function(t){sum+=t.p;});
    var pct=tasks.length?Math.min(100,Math.round(sum/tasks.length)):100,last=tasks[tasks.length-1];
    pctEl.textContent=pct+'%';pgEl.style.strokeDashoffset=(C*(1-pct/100)).toFixed(1);
    if(last){lbEl.textContent=last.label;subEl.textContent=last.sub||SUB[last.phase]||'';}
  }
  function show(){build();clearTimeout(hideT);el.classList.add('on');shownAt=Date.now();paint();}
  function hide(){
    if(!el)return;
    var w=Math.max(0,350-(Date.now()-shownAt));
    hideT=setTimeout(function(){if(!tasks.length)el.classList.remove('on');},w);
  }
  function step(){
    for(var i=tasks.length-1;i>=0;i--){
      var t=tasks[i],cap;
      if(t.done){t.p=Math.min(100,t.p+Math.max(5,(100-t.p)*.4));if(t.p>=100)tasks.splice(i,1);continue;}
      cap=t.phase==='up'?8+52*t.up:(t.phase==='wait'?90:90+9*t.dl);
      if(t.p<cap)t.p=Math.min(cap,t.p+Math.max(.15,(cap-t.p)*.09));
    }
    paint();
    if(!tasks.length){clearInterval(tick);tick=null;hide();}
  }
  function start(label,sub,phase){
    var t={label:label||'Memuat',sub:sub||'',phase:phase||'wait',up:0,dl:0,p:0,done:false};
    tasks.push(t);
    if(!tick)tick=setInterval(step,60);
    if(!isOn()&&!showT)showT=setTimeout(function(){showT=null;if(tasks.length)show();},150);
    return {
      set:function(ph,f){t.phase=ph;if(ph==='up')t.up=f||0;if(ph==='dl')t.dl=f||0;},
      end:function(){
        if(!isOn()){
          var i=tasks.indexOf(t);if(i>=0)tasks.splice(i,1);
          if(!tasks.length){clearTimeout(showT);showT=null;if(tick){clearInterval(tick);tick=null;}}
          return;
        }
        t.done=true;
      }
    };
  }
  function xhr(url,opt,label){
    opt=opt||{};
    return new Promise(function(resolve,reject){
      var post=!!opt.body,t=label===false?null:start(label||(post?'Mengirim data':'Memuat data'),post?'Mengirim data dan memproses di server':'Memuat dari server','wait');
      var x=new XMLHttpRequest(),fin=false;
      function done(){if(t&&!fin)t.end();fin=true;}
      x.open(opt.method||(post?'POST':'GET'),url,true);
      if(post)x.setRequestHeader('Content-Type','text/plain;charset=utf-8');
      x.timeout=120000;
      if(t){
        /* JANGAN pasang x.upload.* : listener upload memaksa preflight CORS yang ditolak Apps Script */
        x.onprogress=function(e){t.set('dl',e.lengthComputable&&e.total?e.loaded/e.total:.5);};
      }
      x.onload=function(){
        done();
        var j;try{j=JSON.parse(x.responseText);}catch(e){return reject(new Error('Respons server tidak valid. Coba lagi.'));}
        if(x.status>=400)return reject(new Error('Server bermasalah ('+x.status+').'));
        resolve(j);
      };
      x.onerror=x.ontimeout=x.onabort=function(){done();reject(new Error('Koneksi bermasalah. Periksa internet lalu coba lagi.'));};
      x.send(post?opt.body:null);
    });
  }
  function work(label,sub,fn){
    var t=start(label,sub,'wait');
    return Promise.resolve().then(fn).then(function(v){t.end();return v;},function(e){t.end();throw e;});
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
  return {start:start,xhr:xhr,work:work,sleep:sleep};
})();
</script>
<style>.brandlogo{display:block;height:54px;max-width:200px;object-fit:contain;margin:0 0 12px}:root{--jpl2:#45bcc4}</style>
<style>.sosrow{display:grid;grid-template-columns:140px 1fr;gap:8px}@media(max-width:360px){.sosrow{grid-template-columns:1fr}}</style>
</head>
<body>
<main>
  <img class="brandlogo" src="https://marketingexata.github.io/afiliatorjp/logojps.png" alt="JP SMART SIM" onerror="jpLogoErr(this)">
  <h1>Klaim SIM JP SMART SIM</h1>
  <p class="sub">Indonesia Japan Friendship Festival 2026, Odaiba</p>

  <div id="banner" class="banner" hidden></div>
  <div id="loadErr" class="err" hidden></div>

  <form id="form" class="card" novalidate hidden>
    <label for="nama">Nama lengkap</label>
    <input id="nama" type="text" autocomplete="name" maxlength="80">

    <label for="wa">Nomor WhatsApp</label>
    <input id="wa" type="tel" inputmode="numeric" autocomplete="tel" placeholder="819012345678">
    <p class="hint">Pakai kode negara, tanpa 0 di depan. Contoh: 819012345678 atau 628123456789.</p>

    <label for="pref">Tinggal di</label>
    <select id="pref">
      <option value="">Pilih wilayah</option>
      <option>Tokyo</option><option>Chiba</option><option>Saitama</option><option>Kanagawa</option>
      <option>Ibaraki</option><option>Tochigi</option><option>Gunma</option><option>Lainnya (di luar Kanto)</option>
    </select>

    <label for="sosPlat">Akun sosial media <span class="hint" style="display:inline">(opsional)</span></label>
    <div class="sosrow">
      <select id="sosPlat" aria-label="Platform sosial media"><option>Instagram</option><option>TikTok</option></select>
      <input id="sosAkun" type="text" maxlength="60" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="@username" aria-label="Username sosial media">
    </div>
    <p class="hint">Tulis username saja, tanpa spasi. Contoh: @namakamu</p>

    <label for="kode">Kode referral</label>
    <input id="kode" type="text" maxlength="20" autocapitalize="characters" placeholder="Kode dari afiliator">
    <p id="kodeHint" class="hint"></p>

    <div class="hp" aria-hidden="true"><input id="website" type="text" tabindex="-1" autocomplete="off"></div>

    <label class="check"><input id="setuju" type="checkbox">
      <span>Saya setuju data saya dipakai untuk menyiapkan kartu SIM dan memverifikasi pengambilan, serta dihubungi lewat WhatsApp.</span></label>

    <p id="err" class="err" role="alert" hidden></p>
    <button id="btn" type="submit">Kirim pendaftaran</button>
  </form>

  <section id="done" class="ticket" hidden></section>
</main>

<script>
// ===== GANTI dengan URL Web App Apps Script (berakhiran /exec) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbwQ115XVOEhwNOC05oTR1VnxRn-gyVgfbrBgZ4d4YsKGWoifrnU7-L8Y2bUadGOVrWBzw/exec';
// ===================================================================

const $ = id => document.getElementById(id);
const REF = (new URLSearchParams(location.search).get('ref') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20);
let CFG = null;

function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function api(params, body, label) {
  const url = API_URL + (params ? '?' + new URLSearchParams(params) : '');
  return body
    ? JPL.xhr(API_URL, { method: 'POST', body: JSON.stringify(body) }, label || 'Mengirim pendaftaran')
    : JPL.xhr(url, {}, label);
}

async function init() {
  try {
    CFG = await api({ action: 'config' }, null, 'Memuat halaman');
  } catch (e) {
    return showLoadErr('Halaman belum bisa memuat data. Periksa koneksi lalu muat ulang.');
  }
  if (!CFG.ok) return showLoadErr('Halaman belum bisa dipakai. Hubungi PIC JP SMART SIM.');
  if (CFG.mode === 'TUTUP') return showLoadErr('Pendaftaran sedang ditutup.');

  const b = $('banner');
  b.hidden = false;
  if (CFG.mode === 'GRATIS') {
    b.innerHTML = '<strong>SIM gratis, ambil langsung di booth</strong>Daftar dulu di sini, lalu datang ke ' + esc(CFG.info_booth) + '.';
  } else {
    b.className = 'banner paid';
    b.innerHTML = '<strong>Pengambilan gratis di event sudah berakhir</strong>SIM tersedia seharga ¥' + Number(CFG.harga_yen).toLocaleString('id-ID') + ' dengan internet gratis 2 bulan pertama. ' + esc(CFG.info_bayar);
    $('btn').textContent = 'Daftar dan pesan SIM';
  }
  $('form').hidden = false;

  if (REF) {
    $('kode').value = REF;
    checkKode(true);
  }
}

function showLoadErr(msg) { const e = $('loadErr'); e.textContent = msg; e.hidden = false; }

async function checkKode(fromLink) {
  const k = $('kode').value.trim().toUpperCase();
  const h = $('kodeHint');
  if (!k) { h.textContent = ''; h.className = 'hint'; return false; }
  try {
    const r = await api({ action: 'cekkode', kode: k }, null, 'Memeriksa kode referral');
    if (r.valid) {
      h.textContent = fromLink ? 'Kode terisi otomatis dari link dan terkunci.' : 'Kode valid.';
      h.className = 'hint good';
      if (fromLink) $('kode').readOnly = true;
      return true;
    }
  } catch (e) { return true; } // jaringan gagal: biarkan server yang memvalidasi saat kirim
  h.textContent = 'Kode tidak ditemukan. Periksa lagi atau minta link baru ke afiliator.';
  h.className = 'hint bad';
  $('kode').readOnly = false;
  return false;
}

$('kode').addEventListener('blur', () => { if (!$('kode').readOnly) checkKode(false); });

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = $('err'); err.hidden = true;
  const payload = {
    action: 'daftar',
    nama: $('nama').value, whatsapp: $('wa').value, prefektur: $('pref').value,
    sosmed_platform: $('sosPlat').value, sosmed_akun: $('sosAkun').value,
    kode: $('kode').value, setuju: $('setuju').checked, website: $('website').value,
  };
  const btn = $('btn'); const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Mengirim...';
  try {
    const r = await api(null, payload);
    if (!r.ok) throw new Error(r.error || 'Pendaftaran gagal. Coba lagi.');
    renderDone(r);
  } catch (e) {
    err.textContent = e.message || 'Pendaftaran gagal. Periksa koneksi lalu coba lagi.';
    err.hidden = false;
    btn.disabled = false; btn.textContent = label;
  }
});

function renderDone(r) {
  $('form').hidden = true; $('banner').hidden = true;
  const d = $('done'); d.hidden = false;
  if (r.duplicate) {
    d.innerHTML = '<h2>Nomor sudah terdaftar</h2><p>' + esc(r.message) + '</p>';
    return;
  }
  const gratis = r.mode === 'GRATIS';
  d.innerHTML =
    '<p>Pendaftaran berhasil. Simpan tiket ini.</p>' +
    '<div class="id">' + esc(r.id) + '</div>' +
    '<ul>' + (gratis
      ? '<li>Screenshot halaman ini.</li><li>Datang ke ' + esc(CFG.info_booth) + '.</li><li>Tunjukkan tiket dan identitas ke staf booth.</li>'
      : '<li>Screenshot halaman ini.</li><li>' + esc(CFG.info_bayar) + '</li><li>SIM diproses setelah pembayaran ¥' + Number(CFG.harga_yen).toLocaleString('id-ID') + ' dikonfirmasi.</li>') +
    '</ul>';
  window.scrollTo(0, 0);
}

init();
</script>
</body>
</html>
